# Shared settings for backend tests. Activated with @ActiveProfiles("test").
# Spring loads application.properties first, then this file overrides it,
# so tests need no real database, JWT secret or admin environment variables.

# In-memory H2 database instead of Postgres
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only values (never used outside tests)
jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
app.admin.email=admin@example.test
app.admin.password=test-only-password
google.login.enabled=false
