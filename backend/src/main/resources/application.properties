spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hunter_exam}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

server.port=${PORT:8080}

# CORS: comma-separated list of allowed frontend origins
# Local default: http://localhost:5173 (Vite dev server)
# Production: set this env var to your Vercel URL
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}